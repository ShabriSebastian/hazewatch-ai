[project]
name = "haze-early-warning"
version = "1.0.0"
description = "Transboundary haze early-warning backend: PM2.5 forecasting and last-mile alerting for institutions in West Kalimantan and Sarawak"
requires-python = ">=3.11"
# This package builds data and trains models. It no longer serves anything.
#
# The API that used to live under `src/haze/api/` was retired along with the
# September 2023 replay it existed to narrate; the dashboard reads a published
# snapshot instead. FastAPI, uvicorn and pydantic went with it. The split
# between a slim "serving" install and a heavier "pipeline" extra went with it
# too - there is no longer a runtime whose image size that split was protecting,
# so what used to be an extra is simply the dependency list.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyarrow>=17",
    "joblib>=1.4",
]

[project.optional-dependencies]
# Retained as an alias so `pip install -e ".[dev,pipeline]"` in existing notes
# and in `make venv` keeps working. Everything it named is now a hard
# dependency above.
pipeline = []
# The GRU forecaster. The Random Forest path works without this.
torch = ["torch>=2.4"]
# httpx went with the API: it was here only for fastapi's TestClient.
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
